:root{color-scheme:light}
*{box-sizing:border-box;min-width:0;margin:0;padding:0}
body{background:#FDFAF4;color:#1a1a2e;font:17px/1.6 'Dot','DotGothic16',monospace;overflow-x:clip}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.hd{background:#1a1a2e;color:#FFE83F;text-align:center;font-size:26px;padding:10px 0;letter-spacing:.15em;margin-bottom:6px}
.lead{text-align:center;font-size:15px;margin-bottom:18px}
.parade{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px 0;margin-bottom:18px;align-items:end}
.parade img{height:clamp(68px,20.5vw,110px);width:auto;max-width:100%;justify-self:center;object-fit:contain}
.win{border:5px solid #1a1a2e;background:#fff;padding:18px 18px 20px;box-shadow:6px 6px 0 #1a1a2e}
.win label{display:block;font-size:15px;margin:12px 0 6px}
.row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
input,select{font:inherit;font-size:17px;width:100%;height:46px;border:3px solid #1a1a2e;background:#FDFAF4;padding:0 10px;border-radius:0;color:#1a1a2e}
input:focus,select:focus{outline:3px solid #FFE83F;outline-offset:1px}
.hint{font-size:13px;color:#5F5E5A;margin-top:4px}
.go{display:block;width:100%;margin-top:20px;height:56px;font:inherit;font-size:20px;background:#FFE83F;color:#1a1a2e;border:4px solid #1a1a2e;cursor:pointer;box-shadow:4px 4px 0 #1a1a2e}
.go:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #1a1a2e}
.err{color:#A32D2D;font-size:14px;margin-top:10px;min-height:1em}
#out{margin-top:24px;display:none}
#out img.res{width:100%;display:block;border:4px solid #1a1a2e}
.save{text-align:center;font-size:15px;margin:12px 0 4px}
.warn{background:#FAEEDA;border:3px solid #854F0B;color:#633806;font-size:14px;padding:10px 12px;margin-top:12px}
.again{background:#fff}
.busy{text-align:center;padding:30px 0;font-size:18px}
#stage{position:absolute;left:-99999px;top:0}
/* ===== 結果カード（1080×1920） ===== */
.card{width:1080px;height:1920px;background:#FDFAF4;font-family:'Dot',monospace;color:#1a1a2e;position:relative;font-size:16px;line-height:1.5}
.frame{position:absolute;left:24px;top:24px;right:24px;bottom:24px;border:10px solid #1a1a2e;padding:30px 48px;display:flex;flex-direction:column;overflow:hidden}
.title{position:relative;z-index:3;background:#1a1a2e;color:#FFE83F;text-align:center;font-size:40px;padding:10px 0;letter-spacing:.2em}
.sub{text-align:center;font-size:30px;margin:14px 0 0;position:relative;z-index:2}
.hero{display:flex;align-items:center;gap:10px;margin:30px 0 40px}
.aura{flex:none;width:540px;height:540px;position:relative}
.aura .bg{position:absolute;left:50%;top:50%;width:760px;height:760px;transform:translate(-50%,-50%)}
.aura .ch{position:absolute;left:50%;top:50%;height:440px;transform:translate(-50%,-50%)}
.side{flex:1;display:flex;flex-direction:column;gap:40px}
.bub{position:relative;z-index:2}
.bub .in{background:#FFF0F6;border:7px solid #1a1a2e;border-radius:36px;padding:18px 20px;font-size:28px;line-height:1.55}
.t1{position:absolute;left:-38px;top:70px;width:0;height:0;border-top:22px solid transparent;border-bottom:22px solid transparent;border-right:40px solid #1a1a2e}
.t2{position:absolute;left:-23px;top:79px;width:0;height:0;border-top:13px solid transparent;border-bottom:13px solid transparent;border-right:26px solid #FFF0F6}
.ty{text-align:center;position:relative;z-index:2}
.ty p{font-size:26px;margin-bottom:8px}
.ty div{display:flex;justify-content:center;align-items:center;gap:12px;font-size:44px}
.ty span.tg{border:5px solid #1a1a2e;padding:0 20px;color:#fff}
.chips{display:flex;justify-content:center;align-items:center;gap:16px;font-size:30px;margin-bottom:8px}
.chip{border:5px solid #1a1a2e;padding:4px 22px}
.name{position:relative;width:916px;height:205px;margin:0 0 40px}
.name img{position:absolute;left:0;top:0;width:916px;height:205px}
.name p{position:absolute;left:92px;right:92px;top:24px;height:144px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:50px;line-height:1.25;color:#1a1a2e}
.name p small{font-size:32px}
.name p span{font-size:60px;line-height:1.15}
.box{border:7px solid #1a1a2e;margin-bottom:40px;position:relative}
.box .in{border:5px solid #fff;padding:18px 26px;font-size:32px;line-height:1.55}
.box .q{color:#5F5E5A}
.beh{display:flex;gap:12px}
.lbl{font-size:27px;display:flex;align-items:center;gap:10px;color:#1a1a2e}
.cmd{position:relative;background:#FFE83F;border:8px solid #1a1a2e;margin:34px 0 20px;padding:6px}
.cmd .w{border:6px solid #fff;background:#FFF6B8;padding:30px 28px 24px}
.cmd .tag{position:absolute;left:28px;top:-30px;background:#E91E8C;color:#fff;border:6px solid #1a1a2e;font-size:30px;padding:2px 22px;z-index:3}
.cmd p{font-size:42px;line-height:1.5;color:#1a1a2e}
.cmd:not(.ybox) .w p{text-align:center}
.cmd .st{position:absolute;width:34px;height:34px}
.ybox .w p.big{font-size:33px;line-height:1.5;margin-top:4px}
.ybox .w p.end{font-size:32px;color:#E91E8C;text-align:right;margin-top:8px}
.mid{flex:1;display:flex;flex-direction:column;justify-content:space-evenly}
.mid>*{margin-top:0!important;margin-bottom:0!important}
.next{text-align:right;font-size:34px;padding:0 6px 10px}
.next+.foot{margin-top:0}
.otaku{width:880px;display:block;margin:0 auto}
.pg{text-align:center;font-size:15px;margin:14px 0 4px}
.intro{display:flex;flex-direction:column;align-items:center;margin:14px 0 20px}
.mini{flex:none;width:345px;height:380px;position:relative;margin-bottom:8px}
.mini .bg{position:absolute;left:50%;top:50%;width:560px;height:560px;transform:translate(-50%,-50%);z-index:0}
.mini .ch{position:absolute;left:50%;top:50%;height:285px;z-index:1;transform:translate(-50%,-50%)}
.intro p{font-size:30px;line-height:1.6;text-align:center;position:relative;z-index:2}
.intro .lead2{font-size:42px;line-height:1.45;margin-bottom:10px}
.intro .hl{color:#E91E8C}
.box .big{font-size:32px;line-height:1.5;margin-top:8px}
.box .end{font-size:32px;color:#E91E8C;text-align:right;margin-top:6px}
.lost{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:10px;font-size:31px;line-height:1.45}
.lost .lt+span{margin-bottom:10px}
.lost .lt{font-size:24px;background:#1a1a2e;color:#fff;padding:2px 12px;white-space:nowrap}
.credit{font-size:21px;text-align:right;color:#5F5E5A;margin:0}
.foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;border-top:6px dashed #1a1a2e;padding-top:14px}

function sign(lon){return SIGNS[Math.floor((((lon%360)+360)%360)/30)];}
function japanDST(y,m,d,h){
  const Q={1948:[[5,2],[9,12]],1949:[[4,3],[9,11]],1950:[[5,7],[9,10]],1951:[[5,6],[9,9]]};
  if(!Q[y]) return false;
  const v=m*100+d, s=Q[y][0][0]*100+Q[y][0][1], e=Q[y][1][0]*100+Q[y][1][1];
  return v>=s && (v<e || (v===e && h<1));
}
function planets(y,m,d,h,mi){
  const tz=japanDST(y,m,d,h)?10:9;
  const A=window.Astronomy, date=new Date(Date.UTC(y,m-1,d,h,mi)-tz*3600000), P={};
  P.Sun=sign(A.SunPosition(date).elon);
  P.Moon=sign(A.EclipticGeoMoon(date).lon);
  ['Mercury','Venus','Mars','Jupiter','Saturn'].forEach(k=>{P[k]=sign(A.Ecliptic(A.GeoVector(A.Body[k],date,true)).elon);});
  return P;
}
function auraPNG(hex){
  const c=document.createElement('canvas'); c.width=c.height=540; const x=c.getContext('2d');
  const n=parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255, col=a=>'rgba('+r+','+g+','+b+','+a+')';
  const gr=x.createRadialGradient(270,270,0,270,270,270);
  for(let i=0;i<=20;i++){const r=i/20; gr.addColorStop(r,col((Math.pow(1-r*r,1.25)).toFixed(3)));}
  x.fillStyle=gr; x.fillRect(0,0,540,540);
  return c.toDataURL();
}
function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(v*k)));return '#'+[n>>16,(n>>8)&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('');}
function ribbon(hex){
  const N='#1a1a2e';hex='#E8C66A';const D='#B8933A';
  const tail=(x)=>{const m=x<120;const xo=m?0:241;const fl=v=>m?v:241-v;
    const pts=[[0,14],[34,14],[34,50],[0,50],[9,32]].map(([a,b])=>fl(a)+','+b).join(' ');
    return '<polygon points="'+pts+'" fill="'+hex+'" stroke="'+N+'" stroke-width="2" stroke-linejoin="miter"/>'+
      '<polygon points="'+[[22,44],[34,44],[34,52]].map(([a,b])=>fl(a)+','+b).join(' ')+'" fill="'+D+'" stroke="'+N+'" stroke-width="2"/>';};
  let s='<svg xmlns="http://www.w3.org/2000/svg" width="964" height="216" viewBox="0 0 241 54" shape-rendering="crispEdges">'+tail(0)+tail(241)+
   '<rect x="22" y="3" width="197" height="41" fill="#FFF3C4" stroke="'+N+'" stroke-width="2"/>'+
   '<rect x="26" y="7" width="189" height="33" fill="none" stroke="#E8C66A" stroke-width="1"/>'+
   '<rect x="22" y="44" width="12" height="2" fill="'+N+'"/><rect x="207" y="44" width="12" height="2" fill="'+N+'"/>';
  [[30,11],[209,11],[30,34],[209,34]].forEach(([x,y])=>{s+='<rect x="'+x+'" y="'+(y-1)+'" width="1" height="3" fill="#E8B23A"/><rect x="'+(x-1)+'" y="'+y+'" width="3" height="1" fill="#E8B23A"/>';});
  return svgURL(s+'</svg>');
}

async function shoot(html){
  const stage=$('stage'); stage.innerHTML=html;
  await Promise.all([...stage.querySelectorAll('img')].map(im=>im.complete?0:new Promise(ok=>{im.onload=im.onerror=ok;})));
  const cv=await html2canvas(stage.firstChild,{width:1080,height:1920,scale:1,backgroundColor:'#FDFAF4',logging:false});
  stage.innerHTML=''; return cv.toDataURL('image/png');
}
$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const y=+$('y').value,m=+$('m').value,d=+$('d').value,err=$('err');
  if(!y||!m||!d){err.textContent='生年月日を選んでね';return;}
  const dt=new Date(y,m-1,d); if(dt.getMonth()!==m-1){err.textContent='その日付はないみたい。もう一度選んでね';return;}
  err.textContent='';

  const out=$('out'); out.style.display='block'; out.innerHTML='<p class="busy">キャラを呼び出し中…</p>';
  let note='';
  if(!tv){const a=planets(y,m,d,0,0).Moon,b=planets(y,m,d,23,59).Moon; if(a!==b) note='この日は途中で月の星座が切り替わるので、生まれた時間を入れるとより正確になります（今は12時で計算）。';}

    const P=planets(y,m,d,h,mi);
